# HTTP Server Configuration
#
# Port number to listen on
port 8080

# Thread pool size
thread_pool_size 10

# Document root directory
doc_root ./html_docs

# Debug mode (1=on, 0=off)
debug 1

# Log to console (1=yes, 0=no)
# Set to 0 to disable console output, logs will only be written to files
log_to_console 0
