# HTTP Server 配置
#
# 端口号 (默认8080) 
port 8080

# Thread pool size (优化为CPU核心数的2-4倍，提高并发处理能力)
thread_pool_size 8

# Document root directory
doc_root ./html_docs

# Debug mode (1=on, 0=off) - 压测时关闭调试模式提高性能
debug 0

# Log to console (1=yes, 0=no) - 压测时关闭控制台日志减少IO开销
# Set to 0 to disable console output, logs will only be written to files
log_to_console 0

# TLS / HTTPS 配置（默认关闭）
# enable_tls 1
# tls_cert_file ./certs/server.crt
# tls_key_file ./certs/server.key
# tls_cipher_suites TLS_AES_256_GCM_SHA384:TLS_CHACHA20_POLY1305_SHA256
