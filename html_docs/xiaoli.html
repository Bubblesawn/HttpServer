<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>小李的个人页面</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f4f9;
            color: #333;
        }
        .container {
            width: 80%;
            margin: 0 auto;
            padding: 20px;
            background-color: #fff;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            margin-top: 50px;
        }
        h1 {
            text-align: center;
            color: #4CAF50;
        }
        p {
            line-height: 1.6;
        }
        img {
            display: block;
            margin: 0 auto;
            max-width: 200px;
            border-radius: 50%;
        }
    </style>
</head>
<body>
    <div class="container">
        <img src="https://picsum.photos/200" alt="测试头像">

        <h1>小李</h1>
        <p>你好！我叫小李，是一名热爱编程的开发者。我专注于C/C++等语言的学习和应用，致力于开发高效、可靠的软件解决方案。很高兴在这里与你分享我的技术心得和项目经验。</p>
    </div>
</body>
</html>
